name = "interac-inbox"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "DB"
database_name = "interac_inbox"
database_id = "REPLACE_WITH_YOUR_D1_ID"
migrations_dir = "migrations"

[vars]
INTERAC_DOMAIN_ALLOWLIST = "payments.interac.ca,interac.ca,notifications.interac.ca"

# Secrets (set via `npx wrangler secret put <NAME>`):
# API_KEY
# WEBHOOK_SIGNING_KEY
